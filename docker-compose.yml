services:
  postgres:
    image: ankane/pgvector:latest # also fix typo: "lastest" → "latest"
    container_name: talent_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-talent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-talent123}
      POSTGRES_DB: ${DB_NAME:-talent_platform}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-talent}']
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:latest
    container_name: talent_minio
    restart: no
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
